# ==============================================================================
# SearXNG Configuration - Lean Version
# ==============================================================================
# For full documentation: https://docs.searxng.org/
# This is a flat, minimal configuration - edit to customize

general:
  instance_name: "Opencode Search"
  base_url: http://0.0.0.0:8080
  public_url: http://0.0.0.0:8080
  default_search_engine: google

ui:
  title: "Opencode Search"
  default_category: general
  show_suggestions: true
  categories:
    - name: General
      url: general
    - name: Images
      url: images
    - name: Videos
      url: videos
    - name: News
      url: news
    - name: Social Media
      url: social
    - name: Maps
      url: maps
    - name: Code
      url: code
    - name: Libraries
      url: libraries
    - name: It
      url: it

